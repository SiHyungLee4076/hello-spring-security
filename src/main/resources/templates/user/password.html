<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .form-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .page-header { border-left: 4px solid #e94560; padding-left: 1rem; }
        .btn-submit { background: #0f3460; border-color: #0f3460; color: white; }
        .btn-submit:hover { background: #1a1a2e; border-color: #1a1a2e; color: white; }
        .field-error { color: #dc3545; font-size: 0.85rem; margin-top: 0.25rem; font-weight: 500; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}">홈</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">상품 목록</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm px-3">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header mb-4">
        <h4 class="fw-bold mb-0">비밀번호 변경</h4>
        <small class="text-muted">보안을 위해 주기적으로 비밀번호를 변경해 주세요.</small>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card form-card">
                <div class="card-body p-5">

                    <form th:action="@{/user/password}" th:object="${passwordChangeDto}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">현재 비밀번호</label>
                            <input type="password" th:field="*{currentPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"/>
                            <div class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">현재 비밀번호 오류</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">새 비밀번호</label>
                            <input type="password" th:field="*{newPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"/>
                            <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">새 비밀번호 오류</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">새 비밀번호 확인</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"/>
                            <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">새 비밀번호 확인 오류</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-submit btn-lg flex-grow-1 fw-semibold">변경하기</button>
                            <a th:href="@{/home}" class="btn btn-outline-secondary btn-lg px-4">취소</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<hr class="mt-5"/>
<footer class="text-center pb-4 text-muted" style="font-size: 0.9rem;">
    <div class="container">
        <span>학번: 2071248</span> │
        <span>성명: 이시형</span> │
        <span>실습 수행 일시:
            <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span>
        </span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
